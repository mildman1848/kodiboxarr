name: Test and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 tests and plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Lint Python
        run: ruff check .

      - name: Build Dispatcharr plugin ZIP
        run: python scripts/build_plugin_zip.py

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: kodiboxarr-plugin-zip
          path: dist/kodiboxarr-*.zip
          if-no-files-found: error
